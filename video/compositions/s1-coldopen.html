    <script>
      (() => {
        const BAR = 2.5263157894736843;
        const BEAT = BAR / 4;
        const b = (n) => n * BAR;

        const board = document.getElementById("co-board");
        const units = [];
        for (let i = 0; i < 2; i++) {
          const cell = document.createElement("div");
          cell.className = "co-cell";
          cell.innerHTML =
            '<div class="co-half top"><div class="co-glyph"></div></div>' +
            '<div class="co-half bot"><div class="co-glyph"></div></div>' +
            '<div class="co-leaf">' +
            '<div class="co-face front"><div class="co-glyph"></div></div>' +
            '<div class="co-face back"><div class="co-glyph"></div></div>' +
            "</div>";
          board.appendChild(cell);
          units.push({
            top: cell.querySelector(".co-half.top .co-glyph"),
            bot: cell.querySelector(".co-half.bot .co-glyph"),
            leaf: cell.querySelector(".co-leaf"),
            front: cell.querySelector(".co-face.front .co-glyph"),
            back: cell.querySelector(".co-face.back .co-glyph"),
          });
        }

        // One flap unit at a continuous position `v`: floor(v) is the digit on
        // show, frac(v) is how far the leaf has fallen (0 → 1 = 0° → -180°).
        function renderUnit(u, v) {
          const d = Math.floor(v);
          const f = v - d;
          const cur = ((d % 10) + 10) % 10;
          const next = (cur + 1) % 10;
          u.top.textContent = f > 0 ? next : cur;
          u.bot.textContent = cur;
          u.front.textContent = cur;
          u.back.textContent = next;
          if (f <= 0.001) { u.leaf.style.opacity = "0"; return; }
          u.leaf.style.opacity = "1";
          u.leaf.style.transform = "rotateX(" + -180 * f + "deg)";
          u.leaf.style.visibility = f > 0.995 ? "hidden" : "visible";
        }

        const v = { n: 0 };
        function paint() {
          const n = v.n;
          // The tens flap is CARRIED by the ones flap, exactly as on a real
          // board: it sits still until the ones is passing 9, then goes with it.
          const carry = Math.min(1, Math.max(0, (n % 10) - 9));
          renderUnit(units[0], Math.floor(n / 10) + carry);
          renderUnit(units[1], n);
        }
        paint();

        const tl = gsap.timeline({ paused: true });
        const OUT = "power3.out";

        // --- bar 0 · the platform, then the train ------------------------
        tl.fromTo("#co-plate-wrap", { opacity: 0, scale: 1.16 },
          { opacity: 1, duration: 0.9, ease: "power2.out" }, 0);
        tl.to("#co-plate-wrap", { scale: 1.03, duration: 8.4, ease: "none" }, 0);

        // --- bar 1 · the departure this was supposed to be ---------------

        tl.fromTo("#co-board", { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.44, ease: OUT }, b(1) + BEAT * 2);
        tl.fromTo("#co-plus", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.26 }, b(1) + BEAT * 2.5);
        tl.fromTo("#co-unit", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.26 }, b(1) + BEAT * 2.7);

        // --- bar 2 → 3 · the roll. Ends exactly on bar 3. ----------------
        tl.to(v, { n: 55, duration: BAR, ease: "power2.out", onUpdate: paint }, b(2));

        // --- bar 3 · it lands, and so does what it costs -----------------
        tl.fromTo("#co-board", { scale: 1 },
          { scale: 1.04, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, b(3));
        tl.fromTo("#co-strike", { width: 0 }, { width: 96, duration: 0.3, ease: "power2.inOut" }, b(3) + BEAT * 1.9);
        tl.fromTo("#co-conn", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.36, ease: OUT }, b(3) + BEAT * 2);
        tl.fromTo("#co-note", { autoAlpha: 0, y: 14 }, { autoAlpha: 0.66, y: 0, duration: 0.36, ease: OUT }, b(3) + BEAT * 3);

        // --- into the cut · the board is still travelling when it is taken
        tl.to("#co-root", { x: -84, duration: 0.9, ease: "power2.in" }, b(3) + BEAT * 2.6);
        tl.to("#co-plate-wrap", { opacity: 0.35, duration: 0.5, ease: "power2.in" }, b(3) + BEAT * 3);

        window.__timelines = window.__timelines || {};
        window.__timelines["coldopen"] = tl;
