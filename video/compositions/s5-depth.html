        // ---- the section label ---------------------------------------------

        // rather than during the block before it.

          tl.to("#de-sec", { opacity: 0, x: -20, duration: 0.14, ease: IN }, t - 0.18);

          tl.fromTo("#de-sec", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.26, ease: OUT }, t);

        const unsect = (at) => tl.to("#de-sec", { opacity: 0, x: -20, duration: 0.16, ease: IN }, at);

        const card = (n, hl, chip, bars = 1) => {
          const at = b(n);
          if (hl) {

              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: OUT }, at);
            tl.to(hl, { opacity: 0, y: -34, filter: "blur(10px)", duration: 0.2, ease: IN }, at + BAR * bars - 0.24);

            tl.fromTo(chip, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.28, ease: OUT }, at + BEAT * 0.55);

          { opacity: 0, x: 170, rotationY: -12, scale: 0.94, transformPerspective: 1400 },

        card(40, "#d1", null, 2);

        });

        tl.to("#de-log", { opacity: 0, y: -28, duration: 0.22, ease: IN }, b(44) - 0.26);

        // label's band and is a stronger cue than a kicker would be, so the

        // twelve read tools across bar 44, seven write tools across bar 45, and
        // the whole wall then stands for a bar
        gsap.utils.toArray("#de-col-read .de-tool").forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, y: 22, scale: 0.9 },
            { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: OUT }, b(44) + BEAT * 1.5 + i * 0.085);
        });
        tl.fromTo("#cap-write", { opacity: 0, y: 20 }, { opacity: 0.82, y: 0, duration: 0.24, ease: OUT }, b(45));
        gsap.utils.toArray("#de-col-write .de-tool").forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, y: 22, scale: 0.9 },
            { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: OUT }, b(45) + BEAT * 0.6 + i * 0.13);
        });
        // clears a beat and a half early so the next section label has the
        // frame to itself when it lands
        tl.to("#de-tools", { opacity: 0, duration: 0.24, ease: IN }, b(47) - BEAT * 1.6);

        // ---- bars 47–53 · passenger rights, on a trip that already happened -
        sect(47, "After the trip");
        tl.fromTo("#de-phone", { opacity: 0, x: 120, scale: 1.05 },
          { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "power4.out" }, b(47));
        card(47, "#d4", "#k4", 2);
        card(49, "#d5", "#k5", 1);

        // the figure counts; it does not fade in, and it lands inside the bar
        const money = { v: 0 };
        const fig = document.getElementById("de-money-fig");
        tl.fromTo("#de-money", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.28, ease: OUT }, b(50));
        tl.to(money, {
          v: 39.95, duration: BEAT * 2.2, ease: "power2.out",
          onUpdate: () => { fig.textContent = "€ " + money.v.toFixed(2); },
        }, b(50));
        tl.to("#de-money", { opacity: 0, y: -30, duration: 0.2, ease: IN }, b(52) - 0.22);
        card(52, "#d7", "#k7", 1);

        // ---- bar 53 · a breath, on the network -----------------------------
        unsect(b(53) - 0.24);
        tl.to("#de-phone", { opacity: 0, x: -140, scale: 0.96, duration: 0.22, ease: IN }, b(53) - 0.24);
        tl.fromTo("#pw53", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.1, ease: OUT }, b(53));
        tl.to("#pw53", { scale: 1.06, duration: 2.3, ease: "none" }, b(53) + 0.3);
        tl.fromTo("#ps53", { opacity: 0 }, { opacity: 1, duration: 0.1 }, b(53));
        tl.fromTo("#pl53", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: OUT }, b(53) + BEAT * 0.6);
        tl.to(["#pw53", "#ps53", "#pl53"], { opacity: 0, duration: 0.14, ease: IN }, b(54) - 0.14);

        // ---- bars 54–60 · booking on live data ------------------------------
        sect(54, "Booking on live data");
        tl.fromTo("#de-phone", { opacity: 0, x: 120, scale: 1.05 },
          { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "power4.out" }, b(54));
        card(54, "#d8", null, 2);
        card(56, "#d9", "#k9", 2);
        card(58, "#d10", null, 2);

        // ---- bars 60–62 · a breath, and what all of it is for ---------------
        unsect(b(60) - 0.24);
        tl.to("#de-phone", { opacity: 0, x: -140, scale: 0.96, duration: 0.22, ease: IN }, b(60) - 0.24);
        tl.fromTo("#pw60", { opacity: 0, scale: 1.09 }, { opacity: 1, scale: 1, duration: 0.1, ease: OUT }, b(60));
        tl.to("#pw60", { scale: 1.07, duration: 4.6, ease: "none" }, b(60) + 0.3);
        tl.fromTo("#ps60", { opacity: 0 }, { opacity: 1, duration: 0.1 }, b(60));
        tl.fromTo("#pl60", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.34, ease: OUT }, b(60) + BEAT * 0.8);
        tl.to(["#pw60", "#ps60", "#pl60"], { opacity: 0, duration: 0.14, ease: IN }, b(62) - 0.14);

        // ---- bars 62–65 · the thesis again, now earned ----------------------
        // Three words, one per bar, and nothing under them. The line that used
        // to close this act and the slogan under it were both cut.
        tl.fromTo("#de-rep", { opacity: 0 }, { opacity: 1, duration: 0.06 }, b(62));
        [["#de-rw1", b(62)], ["#de-rw2", b(63)], ["#de-rw3", b(64)]].forEach(([w, at], i) => {
          tl.fromTo(w, { opacity: 0, yPercent: 24, scale: 1.16, filter: "blur(18px)" },
            { opacity: 1, yPercent: 0, scale: 1, filter: "blur(0px)", duration: 0.26, ease: "power4.out" }, at);
          // the last word is taken by the cut to the outro, not by a fade
          if (i < 2) {
            tl.to(w, { opacity: 0, yPercent: -20, filter: "blur(14px)", duration: 0.18, ease: IN }, at + BAR - 0.08);
          }
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["depth"] = tl;
      })();
    </script>
  </div>
</template>
