    <div id="arch-textbox-171-2" class="pp-text" data-part="plan-tools" style="left:960.4px;top:911.4px;width:99.8px;height:19.4px;text-align:center;justify-content:flex-start;font-size:16.0px;color:#3e4148"><span>Hotels</span></div>
    <img id="arch-grafik-240" class="pp-img" data-part="plan-tools" src="assets/arch/media/image26.svg" alt="" style="left:990.0px;top:840.3px;width:44.0px;height:45.0px" />
    <img id="arch-grafik-247" class="pp-img" data-part="trigger" src="assets/arch/media/image27.svg" alt="" style="left:121.9px;top:377.5px;width:50.1px;height:61.5px" />
    <img id="arch-grafik-250" class="pp-img" data-part="exec-tools" src="assets/arch/media/image28.png" alt="" style="left:1418.6px;top:837.3px;width:47.1px;height:45.9px" />

    <img id="arch-grafik-257" class="pp-img" data-part="plan-tools" src="assets/arch/media/image30.png" alt="" style="left:880.3px;top:863.7px;width:46.0px;height:21.0px" />
    <img id="arch-grafik-261" class="pp-img" data-part="plan-tools" src="assets/arch/media/image29.png" alt="" style="left:880.3px;top:835.5px;width:46.0px;height:29.5px" />
      <!-- pptx:slide8 end -->
          <div id="ar-packet"></div>
        </div>
      </div>

      <!-- the caption sits over whatever the camera is framing, and carries an
           opaque plate to do it; verified readable at t=92.6 and t=93.9 -->
      <div id="ar-caption" data-layout-allow-overlap>
        <div id="ar-step">01 trigger</div>
        <div id="ar-line">A trip is opened.</div>
      </div>
    </div>
    <div id="ar-ignite"></div>

    <script>
      (() => {
        const BAR = 2.5263157894736843;
        const BEAT = BAR / 4;
        const b = (n) => (n - 28) * BAR;      // scene-local: this scene is bar 28

        const tl = gsap.timeline({ paused: true });
        const OUT = "power3.out";
        const INOUT = "power2.inOut";
        const cam = document.getElementById("ar-cam");
        const packet = document.getElementById("ar-packet");

        // Two build-time tags do all the addressing, so nothing here has to
        // know a PowerPoint shape name:
        //   data-part="monitoring"                  which block of the diagram
        //   data-wire="orchestrator>communicator"   which two blocks a wire joins
        // Selectors are assembled by concatenation, never by template literal —
        // the HTML bundler's CSS parser chokes on interpolated selectors.
        // the deck separates its sub-labels with a middot; this film does not
        cam.querySelectorAll(".pp-text span").forEach((el) => {
          if (el.textContent.indexOf("\u00b7") !== -1) {
            el.textContent = el.textContent.replace(/\s*\u00b7\s*/g, " \u2014 ");
          }
        });

        const part = (name) => '#ar-cam [data-part="' + name + '"]';
        const WIRES = "#ar-cam .pp-wires path";

        // ================= REVEAL · bar 28 =================================
        // v2 assembled this diagram over five bars and the brief called it out:
        // too long, and the beat carried none of it. So there is no build any
        // more. The whole system arrives inside one beat, region by region in
        // reading order, and the act gets on with what it is actually for.
        const REGIONS = [
          "trigger", "orchestrator", "chat-model", "memory", "branch",
          "monitoring", "mon-tools", "planner", "plan-tools",
          "communicator", "comm-tools", "executor", "exec-tools", "outputs",
        ];
        REGIONS.forEach((name, i) => {
          tl.fromTo(part(name), { opacity: 0, scale: 0.965 },
            { opacity: 1, scale: 1, duration: 0.30, ease: OUT }, b(28) + i * 0.024);
        });
        // every wire draws at once — one gesture, not fourteen
        tl.set(WIRES, { opacity: 1 }, b(28) + 0.10);
        tl.fromTo(WIRES, { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.44, ease: INOUT }, b(28) + 0.10);

        tl.fromTo("#ar-title", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.36, ease: OUT }, b(28));
        tl.fromTo("#ar-note", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: OUT }, b(28) + BEAT);
        tl.to(["#ar-title", "#ar-note"], { opacity: 0, y: -26, duration: 0.26, ease: "power3.in" }, b(29) - 0.30);

        // ================= TRACE · bars 29–35 ==============================
        // The part of this act that earns its screen time: one real request,
        // walked through the system a step at a time. Eight steps, three
        // quarters of a bar each, so a caption gets ~1.9 s to be read instead
        // of the 1.2 s v2 gave it.
        const STEP = BAR * 0.75;
        const at = (i) => b(29) + i * STEP;

        // the stage dims so the lit path reads as the live one
        tl.to("#ar-cam [data-part]", { opacity: 0.34, duration: 0.34, ease: INOUT }, b(29) - 0.30);
        tl.to(WIRES, { opacity: 0.36, duration: 0.34, ease: INOUT }, b(29) - 0.30);

        // ---- camera -------------------------------------------------------
        // The frame centre is diagram point (930, 460) once #ar-fit's static
        // reframe is accounted for. Moves are decisive — half a second on the
        // step, then dead still while the caption is read.
        const CX = 930, CY = 460;
        const frame = (px, py, s, atT, dur = 0.5, ease = "power3.inOut") =>
          tl.to("#ar-cam", { x: CX - s * px, y: CY - s * py, scale: s, duration: dur, ease: ease }, atT);

        // ---- the packet ---------------------------------------------------
        // Everything below moves ONE element, with x/y only. `cur` is an
        // authoring-time cursor holding where the packet will be when the next
        // instruction starts, so no step has to guess and no handover between
        // two wires can leave a gap for it to jump across.
        const pathFor = (w) => cam.querySelector('.pp-wires path[data-wire="' + w + '"]');
        let cur = { x: 0, y: 0 };

        const put = (pt, atT) => { tl.set("#ar-packet", { x: pt.x, y: pt.y }, atT); cur = pt; };

        // a short eased link between two wire ends — always authored, never
        // implied, so the dot slides between agents instead of teleporting
        const glide = (to, atT, dur) => {
          tl.fromTo("#ar-packet", { x: cur.x, y: cur.y },
            { x: to.x, y: to.y, duration: dur, ease: "power2.inOut", immediateRender: false }, atT);
          cur = to;
        };

        // ride one of the deck's own connector curves. `back` walks it end to
        // start, which is how the bus wires run (the deck draws them
        // agent → orchestrator). Path geometry is static, so this is seek-safe.
        const ride = (w, atT, dur, back) => {
          const path = pathFor(w);
          if (!path) return;
          const len = path.getTotalLength();
          const a = path.getPointAtLength(back ? len : 0);
          const z = path.getPointAtLength(back ? 0 : len);
          // close any gap to this wire's head BEFORE the ride begins
          if (Math.hypot(a.x - cur.x, a.y - cur.y) > 1.5) glide(a, atT - 0.26, 0.26);
          const p = { t: 0 };
          tl.to(p, {
            t: 1, duration: dur, ease: "power1.inOut",
            onUpdate: () => {
              const q = path.getPointAtLength((back ? 1 - p.t : p.t) * len);
              gsap.set(packet, { x: q.x, y: q.y });
            },
          }, atT);
          tl.set(path, { attr: { class: (path.getAttribute("class") || "") + " live" } }, atT);
          cur = z;
        };

        const lite = (name, atT, dur) => {
          tl.to(part(name), { opacity: 1, duration: 0.22, ease: OUT }, atT);
          tl.to(part(name), { opacity: 0.34, duration: 0.34, ease: INOUT }, atT + dur);
        };

        const stepEl = document.getElementById("ar-step");
        const lineEl = document.getElementById("ar-line");
        const say = (atT, step, line) => {
          tl.to("#ar-caption", { opacity: 0, y: -12, duration: 0.14, ease: "power2.in" }, atT - 0.16);
          tl.set(stepEl, { textContent: step }, atT);
          tl.set(lineEl, { textContent: line }, atT);
          tl.fromTo("#ar-caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.26, ease: OUT }, atT);
        };

        // the packet starts exactly ON the head of the first wire, not near it
        // — v2 parked it at a hand-typed coordinate and it visibly jumped onto
        // the graph as soon as the first ride took over.
        put(pathFor("trigger>orchestrator").getPointAtLength(0), at(0) - 0.34);
        tl.fromTo("#ar-packet", { opacity: 0, scale: 0.3 },
          { opacity: 1, scale: 1, duration: 0.26, ease: OUT }, at(0) - 0.34);

        // 01 — the trigger
        say(at(0), "01 trigger", "A trip is opened.");
        frame(430, 420, 1.30, at(0) - 0.34, 0.6);
        lite("trigger", at(0), STEP * 0.8);
        ride("trigger>orchestrator", at(0) + 0.10, STEP * 0.62);

        // 02 — the orchestrator takes it and reaches for its tool bus
        say(at(1), "02 orchestrator", "The ReAct loop picks it up.");
        frame(690, 420, 1.42, at(1));
        lite("orchestrator", at(1), STEP * 0.8);
        lite("chat-model", at(1) + 0.14, STEP * 0.7);
        lite("memory", at(1) + 0.24, STEP * 0.7);
        glide({ x: 820.1, y: 511.3 }, at(1) + STEP * 0.42, STEP * 0.5);

        // 03 — down the bus to monitoring, which reads the live board
        say(at(2), "03 monitoring", "It reads the live board.");
        frame(545, 545, 1.20, at(2));
        lite("monitoring", at(2) + 0.34, STEP * 0.8);
        lite("mon-tools", at(2) + 0.46, STEP * 0.7);
        ride("monitoring>orchestrator", at(2), STEP * 0.66, true);

        // 04 — the gate. True carries on, false goes home; both arrows are on
        //      screen, and the dot takes the one the deck actually draws.
        say(at(3), "04 the gate", "Risk high enough to act on?");
        frame(455, 655, 1.46, at(3));
        lite("branch", at(3) + 0.30, STEP * 0.8);
        ride("monitoring>branch", at(3) + 0.34, STEP * 0.44);

        // 05 — true, out of the top port, along the deck's own true arrow
        say(at(4), "05 planner", "True. Two ways out, checked against your calendar.");
        frame(650, 650, 1.42, at(4));
        lite("planner", at(4) + 0.40, STEP * 0.8);
        lite("plan-tools", at(4) + 0.52, STEP * 0.7);
        ride("branch>branch", at(4) + 0.34, STEP * 0.44);

        // 06 — back up to the orchestrator, then out to the communicator
        say(at(5), "06 communicator", "It drafts the heads-up.");
        frame(1020, 550, 1.24, at(5));
        lite("communicator", at(5) + 0.50, STEP * 0.8);
        lite("comm-tools", at(5) + 0.62, STEP * 0.7);
        glide({ x: 820.1, y: 511.3 }, at(5) - 0.34, 0.44);
        ride("orchestrator>communicator", at(5) + 0.16, STEP * 0.6);

        // 07 — and the executor, the one that may not act on its own
        say(at(6), "07 executor", "Nothing is booked until you say yes.");
        frame(1190, 545, 1.16, at(6));
        lite("executor", at(6) + 0.50, STEP * 0.8);
        lite("exec-tools", at(6) + 0.62, STEP * 0.7);
        ride("orchestrator>communicator", at(6) - 0.36, 0.30, true);
        ride("orchestrator>executor", at(6) + 0.12, STEP * 0.6);

        // 08 — and out to you
        say(at(7), "08 you", "Then it books, and tells the people waiting.");
        frame(1140, 400, 1.22, at(7));
        lite("outputs", at(7) + 0.46, STEP * 0.5);
        ride("orchestrator>executor", at(7) - 0.36, 0.30, true);
        ride("orchestrator>outputs", at(7) + 0.12, STEP * 0.58);

        // ================= SWELL · bar 35 ==================================
        // Out of the close-ups, back onto the whole board, everything coming
        // up together — the bar the track spends climbing to the second drop.
        tl.to("#ar-caption", { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, b(35) - 0.2);
        tl.to("#ar-packet", { opacity: 0, duration: 0.2, ease: "power2.in" }, b(35) - 0.2);
        frame(930, 460, 1.0, b(35), 0.8);
        tl.to("#ar-cam [data-part]", { opacity: 0.64, duration: BAR * 0.8, ease: "power2.in" }, b(35));
        tl.to(WIRES, { opacity: 0.6, duration: BAR * 0.8, ease: "power2.in" }, b(35));

        // ================= CLOSE · bars 36–40 ==============================
        // The second run of the graph is gone. v3 sent four dots round the
        // diagram again here and the note was that it was a second animation
        // of something already shown; the drop now does one thing instead —
        // it puts the WHOLE system back on screen, undimmed, under the closing
        // title. One ignite, one board, one line. Nothing moves except a very
        // slow push, so the four bars read as a held statement rather than as
        // another sequence to follow.
        tl.fromTo("#ar-ignite", { opacity: 0 }, { opacity: 0.6, duration: 0.06, ease: "power4.in" }, b(36) - 0.06);
        tl.to("#ar-ignite", { opacity: 0, duration: 0.3, ease: "power2.out" }, b(36));
        tl.to("#ar-cam [data-part]", { opacity: 1, duration: 0.18, ease: OUT }, b(36));
        tl.to(WIRES, { opacity: 1, duration: 0.18 }, b(36));

        tl.fromTo("#ar-close", { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.34, ease: OUT }, b(36));
        tl.fromTo("#ar-close-note", { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.3, ease: OUT }, b(36) + BEAT);

        // one continuous push from the drop to the wipe, so the act is still
        // travelling when the host takes it to night on bar 40
        frame(930, 460, 1.10, b(36), BAR * 4, "power1.inOut");

        window.__timelines = window.__timelines || {};
        window.__timelines["arch"] = tl;
      })();
    </script>
