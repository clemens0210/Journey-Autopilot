<!-- IDEA 04 — BCG Platinion's mark is a folded prism, so let it FOLD.
     logo_split.py segments the real mark by colour into its five facets
     (emerald, mint, black, graphite, silver). Each facet flies back to its own
     face of the solid along the direction that face points, so the mark looks
     assembled rather than revealed. The wordmark then wipes in, line by line.

     Facet origins come from parts.json, so each shard pivots about itself. -->

        // 1 — the five faces fold in. Each travels along the axis its own face
