     journey breaks and what the alternative costs. A schematic line map does

     than a colour change), and the replan grows out of the same junction.

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const OUT = "power3.out";
        const INOUT = "power2.inOut";
        const train = document.getElementById("rm-train");

        // Ride a path by arc length — same trick scene 08 uses, so the marker
        // sits exactly on the curve rather than on a straight approximation.
        function ride(id, at, dur, ease) {
          const path = document.getElementById(id);
          const len = path.getTotalLength();
          const p = { t: 0 };
          tl.to(
            p,
            {
              t: 1,
              duration: dur,
              ease: ease || "power1.inOut",
              onUpdate: () => {
                const pt = path.getPointAtLength(p.t * len);
                train.style.left = pt.x + "px";
                train.style.top = pt.y + "px";
              },
            },
            at
          );
        }

        const draw = (sel, at, dur) =>
          tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: INOUT }, at);
        // retracting is the same tween, run backwards — the line is taken away
        const retract = (sel, at, dur) =>
          tl.fromTo(sel, { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: dur, ease: "power2.in" }, at);

        tl.fromTo("#rm-kicker", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.42, ease: OUT }, 0.2);
        tl.fromTo("#rm-head", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: OUT }, 0.35);

        // 1 — the booked route draws itself, station by station.
        tl.fromTo("#rm-s-muc", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 0.85);
        tl.fromTo("#rm-n-muc", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.34, ease: OUT }, 0.95);
        draw("#rm-leg1", 1.15, 0.5);
        tl.fromTo("#rm-s-nue", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 1.6);
        tl.fromTo("#rm-n-nue", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.34, ease: OUT }, 1.7);
        draw("#rm-leg2", 1.85, 0.5);
        tl.fromTo("#rm-s-erf", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 2.3);
        tl.fromTo("#rm-n-erf", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.34, ease: OUT }, 2.4);
        draw("#rm-leg3", 2.55, 0.6);
        tl.fromTo("#rm-s-ber", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 3.1);
        tl.fromTo("#rm-n-ber", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.34, ease: OUT }, 3.2);

        // 2 — the train runs the first leg and stops dead at the junction.
        tl.fromTo("#rm-train", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 3.5);
        ride("rm-leg1", 3.6, 1.0, "power2.inOut");

        // 3 — stillness on the junction, then the onward route goes red and is
        //     taken away. Nothing else moves while it happens.
        tl.set("#rm-dead2", { strokeDashoffset: 0 }, 5.05);
        tl.set("#rm-dead3", { strokeDashoffset: 0 }, 5.05);
        retract("#rm-dead2", 5.35, 0.42);
        retract("#rm-leg2", 5.35, 0.42);
        retract("#rm-dead3", 5.45, 0.5);
        retract("#rm-leg3", 5.45, 0.5);
        tl.fromTo("#rm-s-erf", { opacity: 1 }, { opacity: 0.2, duration: 0.4, ease: INOUT }, 5.5);
        tl.fromTo("#rm-n-erf", { opacity: 1 }, { opacity: 0.2, duration: 0.4, ease: INOUT }, 5.5);
        tl.fromTo("#rm-chip-bad", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: OUT }, 5.7);

        // 4 — the replan grows out of the SAME junction the old route died at.
        tl.to("#rm-chip-bad", { opacity: 0, y: -18, duration: 0.24, ease: "power2.in" }, 6.7);
        draw("#rm-alt1", 6.85, 0.5);
        tl.fromTo("#rm-s-lej", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: OUT }, 7.3);
        tl.fromTo("#rm-n-lej", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.34, ease: OUT }, 7.4);
        draw("#rm-alt2", 7.6, 0.6);

        // 5 — and the train takes it.
        ride("rm-alt1", 8.3, 0.75, "power2.in");
        ride("rm-alt2", 9.05, 0.8, "power2.out");
        tl.fromTo("#rm-s-ber", { scale: 1 }, { scale: 1.4, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 9.75);
        tl.fromTo("#rm-chip-good", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.44, ease: OUT }, 9.9);

        tl.to("#rm-root", { x: -70, duration: 1.7, ease: "power2.in" }, 10.3);

        window.__timelines = window.__timelines || {};
        window.__timelines["reroute-map"] = tl;
      })();
    </script>
