      <div data-hf-id="hf-v5yf" id="at-caption">
        <div data-hf-id="hf-0kfr" id="at-step">01 · trigger</div>
        <div data-hf-id="hf-9kpw" id="at-line">A trip is opened.</div>
      </div>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const cam = document.getElementById("at-cam");
        const packet = document.getElementById("at-packet");
        const stepEl = document.getElementById("at-step");
        const lineEl = document.getElementById("at-line");

        // selectors are assembled by concatenation, never by template literal —
        // the HTML bundler's CSS parser chokes on interpolated selectors
        const wire = (w) => cam.querySelector('.pp-wires path[data-wire="' + w + '"]');
        const partSel = (name) => '#at-cam [data-part="' + name + '"]';

        // ---- camera --------------------------------------------------------
        // Frame a point of the diagram; the tween moves the wrapper, so every
        // child (wires included) stays registered with no per-element maths.
        // The visible stage is 1920×866 (the caption band owns the rest), so
        // its optical centre is (960, 433), not (960, 540).
        const CX = 960;
        const CY = 433;
        const frame = (px, py, s, at, dur, ease) =>
          tl.to("#at-cam", { x: CX - s * px, y: CY - s * py, scale: s, duration: dur, ease: ease || "power2.inOut" }, at);

        // ---- packet --------------------------------------------------------
        // Ride a real connector path. `back` walks it from end to start, which
        // is how the bus wires run (the deck draws them agent → orchestrator).
        function ride(w, at, dur, back) {
          const path = wire(w);
          if (!path) return;
          const len = path.getTotalLength();
          const p = { t: 0 };
          tl.to(
            p,
            {
              t: 1,
              duration: dur,
              ease: "power1.inOut",
              onUpdate: () => {
                const pt = path.getPointAtLength((back ? 1 - p.t : p.t) * len);
                packet.style.left = pt.x + "px";
                packet.style.top = pt.y + "px";
              },
            },
            at
          );
          // the wire lights under the packet and stays lit behind it
          tl.set(path, { attr: { class: (path.getAttribute("class") || "") + " live" } }, at);
        }

        // ---- captions ------------------------------------------------------
        const say = (at, step, line) => {
          tl.to("#at-caption", { opacity: 0, y: -10, duration: 0.18, ease: "power2.in" }, at - 0.2);
          tl.set(stepEl, { textContent: step }, at);
          tl.set(lineEl, { textContent: line }, at);
          tl.fromTo("#at-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, at);
        };

        const lite = (name, at, dur) => {
          const sel = partSel(name);
          tl.to(sel, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
          tl.to(sel, { opacity: 0.42, duration: 0.5, ease: "power2.inOut" }, at + dur);
        };

        // ==== the run =======================================================
        // open wide on the whole system, then dive to the trigger
        tl.set("#at-cam", { x: CX - 0.86 * 960, y: CY - 0.86 * 555, scale: 0.86 }, 0);
        tl.fromTo("#at-root", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);

        say(0.55, "01 · trigger", "A trip is opened.");
        lite("trigger", 0.6, 1.1);
        frame(225, 425, 1.35, 0.55, 1.0);
        tl.fromTo("#at-packet", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 1.35);

        ride("trigger>orchestrator", 1.6, 0.75);
        frame(662, 402, 1.2, 1.6, 0.9);

        say(2.35, "02 · orchestrator", "The ReAct loop takes it.");
        lite("orchestrator", 2.35, 1.2);
        lite("chat-model", 2.6, 0.9);
        lite("memory", 2.75, 0.9);

        // orchestrator → monitoring, down the tool bus (drawn agent-first)
        ride("monitoring>orchestrator", 3.7, 0.85, true);
        frame(290, 653, 1.25, 3.7, 1.0);
        say(4.35, "03 · monitoring", "It scores the disruption risk.");
        lite("monitoring", 4.3, 1.3);
        lite("mon-tools", 4.5, 1.2);

        ride("monitoring>branch", 5.75, 0.5);
        frame(567, 655, 1.35, 5.7, 0.8);
        say(6.1, "04 · the gate", "Risk high enough? Then act.");
        lite("branch", 6.05, 1.0);

        ride("branch>planner", 6.95, 0.55);
        frame(843, 653, 1.25, 6.9, 0.85);
        say(7.35, "05 · planner", "Two reroutes, rights checked.");
        lite("planner", 7.3, 1.3);
        lite("plan-tools", 7.5, 1.2);

        ride("orchestrator>communicator", 8.7, 0.7, true);
        frame(1224, 651, 1.2, 8.6, 0.9);
        say(9.15, "06 · communicator", "It drafts the heads-up.");
        lite("communicator", 9.1, 1.1);
        lite("comm-tools", 9.3, 1.0);

        ride("orchestrator>executor", 10.2, 0.7, true);
        frame(1546, 648, 1.2, 10.1, 0.9);
        say(10.65, "07 · executor", "Ready to book — and it waits.");
        lite("executor", 10.6, 1.2);
        lite("exec-tools", 10.8, 1.1);

        // …and the answer goes back out to the passenger
        ride("orchestrator>outputs", 11.75, 0.8);
        frame(1600, 365, 1.15, 11.7, 0.9);
        say(12.2, "08 · you", "“Shall I go ahead?”");
        lite("outputs", 12.15, 1.4);

        // pull back out to the whole system — an arrival, not a retreat
        frame(960, 555, 0.86, 13.0, 1.0, "power2.out");
        tl.to("#at-packet", { opacity: 0, duration: 0.3, ease: "power2.in" }, 13.0);
        tl.to("#at-cam [data-part]", { opacity: 1, duration: 0.7, ease: "power2.out" }, 13.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["arch-trace"] = tl;
      })();
    </script>
