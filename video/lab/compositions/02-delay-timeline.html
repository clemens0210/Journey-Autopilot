    <script>
      (() => {
        // ---- the scenario, in minutes past 20:30 --------------------------
        const X0 = 200; // 20:30 sits here
        const PPM = 1560 / 180; // 3 hours across 1560 px
        const at = (m) => X0 + m * PPM;
        const TRIP = { dep: 30, arr: 120 }; // ICE 528  21:00 → 22:30
        const CONN = { dep: 132, arr: 180 }; // ICE 1006 22:42 → beyond frame
        const DELAY = 55;

        // ---- lay the scene out from that data, once, at build time -------
        const el = (id) => document.getElementById(id);
        const px = (v) => v + "px";

        el("dt-bar1").style.left = px(at(TRIP.dep));
        el("dt-bar1").style.width = px((TRIP.arr - TRIP.dep) * PPM);
        el("dt-label1").style.left = px(at(TRIP.dep) + 22);

        el("dt-bar2").style.left = px(at(CONN.dep));
        el("dt-bar2").style.width = px((CONN.arr - CONN.dep) * PPM + 120);
        el("dt-label2").style.left = px(at(CONN.dep) + 22);

        el("dt-delay").style.left = px(at(TRIP.arr));
        el("dt-delay").style.width = px(DELAY * PPM);
        el("dt-delay-num").style.left = px(at(TRIP.arr) + 26);

        el("dt-gap").style.left = px(at(TRIP.arr));
        el("dt-gap").style.width = px((CONN.dep - TRIP.arr) * PPM);
        el("dt-gap-label").style.left = px(at((TRIP.arr + CONN.dep) / 2));

        // hour ticks, written into the DOM from the same scale
        const ticks = ["20:30", "21:30", "22:30", "23:30"];
        ticks.forEach((label, i) => {
          const m = i * 60;
          const t = document.createElement("div");
          t.className = "dt-tick";
          t.style.left = px(at(m));
          const l = document.createElement("div");
          l.className = "dt-tick-label";
          l.style.left = px(at(m));
          l.textContent = label;
          el("dt-root").appendChild(t);
          el("dt-root").appendChild(l);
        });

        // ---- timeline ------------------------------------------------------
        const tl = gsap.timeline({ paused: true });
        const OUT = "power3.out";

        tl.fromTo("#dt-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.44, ease: OUT }, 0.2);
        tl.fromTo("#dt-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: OUT }, 0.36);

        tl.fromTo("#dt-axis", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.75);
        tl.fromTo(".dt-tick", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.06 }, 1.1);
        tl.fromTo(".dt-tick-label", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.32, stagger: 0.06 }, 1.16);

        // the two trains, as booked

        tl.fromTo("#dt-label1", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.36, ease: OUT }, 1.75);
        tl.fromTo("#dt-bar2", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.0);
        tl.fromTo("#dt-label2", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.36, ease: OUT }, 2.25);

        // the transfer window that the whole booking depends on
        tl.fromTo("#dt-gap", { opacity: 0, scaleY: 0.75 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: OUT }, 2.6);
        tl.fromTo("#dt-gap-label", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.36, ease: OUT }, 2.72);

        // stillness — the plan is on screen and intact for three quarters of
        // a second before anything breaks it
        // …then the delay grows out of the arrival, and does not stop in time.
        tl.fromTo("#dt-delay", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 1.5, ease: "power2.inOut" }, 3.55);
        tl.fromTo("#dt-delay-num", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: OUT }, 4.5);

        // the moment the red passes the connection's departure, the transfer
        // window is gone and the second train greys out of the plan
        tl.to("#dt-gap", { opacity: 0.15, duration: 0.3, ease: "power2.in" }, 4.35);
        tl.to("#dt-gap-label", { opacity: 0.2, duration: 0.3, ease: "power2.in" }, 4.35);
        tl.to("#dt-bar2", { backgroundColor: "#1b1e23", duration: 0.4, ease: "power2.inOut" }, 4.5);

        tl.to("#dt-root", { x: -70, duration: 1.8, ease: "power2.in" }, 7.1);
