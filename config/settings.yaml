# Runtime settings — model tier per agent, the risk gate, reroute bounds.
# See build spec §10. Per-agent model is a config value because it feeds the
# cost/quality trade-off.
#
# READ BY config.py (single source of truth). Each model value is an *alias*
# resolved in config.py's _MODEL_BUILDERS. Available aliases:
#   uni_gpt        — University of Cologne GPT (OpenAI-compatible via LiteLLM)
#                    env: UNI_GPT_MODEL, UNI_GPT_BASE_URL, UNI_GPT_API_KEY
#   bedrock_claude — Claude Sonnet 4.6 on AWS Bedrock via LiteLLM (stronger tier)
#                    env: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user with AmazonBedrockFullAccess)
#                         AWS_REGION (default: us-east-1), BEDROCK_MODEL (default: us.anthropic.claude-sonnet-4-6)
#   bedrock_haiku  — Claude Haiku 4.5 on AWS Bedrock via LiteLLM (fast/cheap tier)
#                    env: same AWS auth as bedrock_claude
#                         BEDROCK_HAIKU_MODEL (default: us.anthropic.claude-haiku-4-5-20251001-v1:0)
# If this file or PyYAML is missing, config.py falls back to these same defaults.

models:
  # One entry per agent in the graph. Every role runs Sonnet 4.6 (bedrock_claude).
  # The tier is deliberately uniform: the evaluation compares architectures, not
  # models, so holding the model fixed makes every run comparable on model choice
  # by construction and keeps per-role cost a statement about the role's workload
  # rather than its price per token. The bedrock_haiku (Haiku 4.5) and uni_gpt
  # aliases stay resolvable for ad-hoc experiments; no shipped role uses them.
  orchestrator: uni_gpt
  monitoring:   uni_gpt
  planner:      uni_gpt
  communicator: uni_gpt
  executor:     uni_gpt

model_params:
  # Optional per-role tuning, forwarded to the model as LiteLLM completion
  # kwargs. Only affects the Bedrock (Claude) aliases above — uni_gpt ignores it.
  # Omitting a role (the default) means NO extended thinking -> fastest/cheapest.
  # Supported knobs (Claude on Bedrock):
  #   reasoning_effort: low | medium | high   # enables thinking (maps to a token budget)
  #   temperature: 0.0 - 1.0
  # Unsupported knobs are dropped rather than erroring (drop_params=True).
  #
  # Example — give the demanding planner some reasoning headroom, at the cost of
  # extra latency/tokens (leave it out to keep the planner fast):
  # planner:
  #   reasoning_effort: medium

thresholds:
  # The "if risk of disruption" gate: at this band and above, the Orchestrator
  # stops at an all-clear and hands the trip to the Planner for reroute options.
  # Below it, the trip is reported as fine and no planning happens.
  # Read by config.AT_RISK_BAND and built into the Orchestrator's instruction.
  at_risk_band: MEDIUM      # LOW | MEDIUM | HIGH

reroute:
  # Deterministic pre-filter for the LIVE journey search (find_reroute_options).
  # The db-vendo search returns the next N departures verbatim — including the
  # traveler's own delayed train, later runs hit by the same disruption, and slow
  # many-transfer routings. These bounds trim that raw list to a few sensible,
  # non-dominated options so the UI shows real choices, not noise. (The curated
  # mock fallback is left untouched.)
  max_options: 6                 # hard cap on discovery and finalized selectable cards
  max_added_delay_minutes: 120   # schedule-relative fallback when no current trip ETA exists
  proposal_ttl_seconds: 900      # finalized live cards must be revalidated after fifteen minutes
